[package]
name = "ree-save-core"
version = "1.0.2"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
    ".", "util", "gui"
]

[lib]
crate-type = ["rlib"]

[features]
default = ["scripting"]
scripting = ["dep:mlua"]
mhwilds = []
dd2 = []
pragmata = []
mhst3 = []
re9 = []
mhrise = []
sf6 = []
re2 = []
re3 = []
re4 = []
re7 = []
re8 = []

[dependencies]
util = { path = "./util/" }
#ree-lib = { path = "../ree-lib-rs/" }
ree-lib = { git = "https://github.com/kvasszn/ree-lib-rs" }
clap = { version = "4.5.20", features = ["derive"] }
image = {version = "0.25.5", features = ["webp"]}
log = "0.4.27"
env_logger = "0.11.8"
num_enum = "0.7.4"
hex-literal = "1.0.0"

# serializing/deserializing
serde = { version = "1.0", features = ["rc", "derive"] }
serde_derive = { version =">=1.0.188"}
serde_json = {version = "1.0", features = ["preserve_order"]}
simd-json = "0.17.0"
bytemuck = {version = "1.24.0", features = ["derive"]}
bytemuck_derive = "1.10.2"

bitflags = { version = "2", features = ["serde"] }
indexmap = { version = "2.7.0", features = ["serde"] }

mlua = {version = "0.11.5", features = ["lua54", "vendored", "async", "send"], optional=true }

cityhasher = "0.1.0"

# compression
flate2 = {version = "1.1.5", features = ["rust_backend"], default-features = false}

# util
rayon = "1.11.0"
bitfield = "0.19.3"
dotenvy = "0.15.7"
half = { version = "2.7.1", features = ["serde"] }

# ui
eframe = "0.33.0"
egui_extras = { version = "0.33.3", features = ["syntect", "image"] }
rfd = "0.17.2"


shellexpand = "3.1.1"
hex = "0.4.3"
regex = "1.12.3"
cbc = "0.2.0"
sha3 = "0.11.0"
rand = "0.10.1"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
blowfish = "0.10.0"
cipher = "0.5.1"
byteorder = "1.5.0"
aes = "0.9.0"
ofb = "0.7.0"
thiserror = "2.0.18"
anyhow = "1.0.102"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
web-time = "1.1.0"


[target.'cfg(target_os = "linux")'.dependencies]
rug = "1.28.0"
num-bigint = { version = "0.4.6", features = ["serde"]}
num-traits = "0.2"
num-integer = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
num-bigint = "0.4.6"
num-traits = "0.2"
num-integer = "0.1"
